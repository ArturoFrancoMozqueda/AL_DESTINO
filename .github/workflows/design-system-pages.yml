name: Publicar design system

on:
  push:
    branches: [main]
    paths:
      - 'marca/**'
      - '.github/workflows/design-system-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar design system y recursos
        uses: actions/upload-pages-artifact@v3
        with:
          path: marca
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
